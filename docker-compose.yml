version: '3.8'

services:
  omni_agent:
    build: .
    container_name: omnisql-agent-app
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/analytics
      - OPENAI_API_KEY=your_openai_api_key_here
      - OPENAI_API_BASE=https://api.openai.com/v1
      - LLM_MODEL=gpt-4o
    stdin_open: true # 允許互動式輸入
    tty: true
    depends_on:
      - db

  # 建立一個沙盒資料庫供 Agent 查詢測試
  db:
    image: postgres:15-alpine
    container_name: omnisql-sandbox-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: analytics
    ports:
      - "5432:5432"